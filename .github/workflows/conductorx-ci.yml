name: ConductorX CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint + type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.7
      - run: ruff check cloud/

  # ---------------------------------------------------------------------------
  # Licence compliance check
  # ---------------------------------------------------------------------------
  licence-check:
    name: Licence Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r cloud/requirements.txt
          pip install pip-licenses==4.4.0
      - name: Check for GPL-only licences
        run: |
          pip-licenses --order=license \
            --fail-on="GPL-3.0-only" \
            --fail-on="GPL-2.0-only" \
            --fail-on="AGPL-3.0"
      - name: Export licence report
        run: pip-licenses --format=markdown > /tmp/LICENCES.md
      - uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: /tmp/LICENCES.md

  # ---------------------------------------------------------------------------
  # Unit + integration tests (Testcontainers)
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd cloud
          pip install -r requirements.txt
      - name: Run tests
        env:
          DOLFI_ENV: ci
        run: pytest cloud/ -v --tb=short
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: /tmp/pytest-*.xml

  # ---------------------------------------------------------------------------
  # Security scan (CodeQL)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Build & push Docker image (main branch only)
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [test, licence-check]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: cloud/
          file: cloud/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/conductorx-api:latest
            ghcr.io/${{ github.repository }}/conductorx-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # GPG-sign release artifacts (on tag push)
  # ---------------------------------------------------------------------------
  sign-release:
    name: GPG Sign Release
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Create and sign release archive
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          tar czf conductorx-${{ github.ref_name }}.tar.gz cloud/
          gpg --batch --yes \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEY_ID" \
              --detach-sign --armor \
              conductorx-${{ github.ref_name }}.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            conductorx-${{ github.ref_name }}.tar.gz
            conductorx-${{ github.ref_name }}.tar.gz.asc
